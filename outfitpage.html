<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>OOTD!</title>
  </head>
  <body>
    <h2>OUTFITS!</h2>
    <div class="outfits-container">
      <section aria-label="Tops">
        <div class="carousel" data-carousel>
          <button class="carousel-button prev" data-carousel-button="prev">
            🢀
          </button>
          <button class="carousel-button next" data-carousel-button="next">
            🢂
          </button>
          <ul data-slides>
            <li class="slide" data-active>
              <img src="./assets/Tops/Top1.png" alt="Green Blue Stripes" />
            </li>
            <li class="slide">
              <img src="./assets/Tops/Top2.png" alt="Gap" />
            </li>
            <li class="slide">
              <img src="./assets/Tops/Top3.png" alt="Taylor Merch" />
            </li>
          </ul>
        </div>
      </section>

      <section aria-label="Pants">
        <div class="carousel" data-carousel>
          <button class="carousel-button prev" data-carousel-button="prev">
            🢀
          </button>
          <button class="carousel-button next" data-carousel-button="next">
            🢂
          </button>
          <ul data-slides>
            <li class="slide" data-active>
              <img src="./assets/Pants/Pants1.png" alt="Pants 1" />
            </li>
            <li class="slide">
              <img src="./assets/Pants/Pants2.png" alt="Pants 2" />
            </li>
            <li class="slide">
              <img src="./assets/Pants/Pants3.png" alt="Pants 3" />
            </li>
          </ul>
        </div>
      </section>

      <section aria-label="Shoes">
        <div class="carousel" data-carousel>
          <button class="carousel-button prev" data-carousel-button="prev">
            🢀
          </button>
          <button class="carousel-button next" data-carousel-button="next">
            🢂
          </button>
          <ul data-slides>
            <li class="slide" data-active>
              <img src="./assets/Shoes/Shoes1.png" alt="Shoes 1" />
            </li>
            <li class="slide">
              <img src="./assets/Shoes/Shoes2.png" alt="Shoes 2" />
            </li>
            <li class="slide">
              <img src="./assets/Shoes/Shoes3.png" alt="Shoes 3" />
            </li>
          </ul>
        </div>
      </section>
    </div>
  </body>
</html>
